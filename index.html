<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Law & Order - Guia de Episódios</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a237e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a237e;
      --primary-light: #3949ab;
      --accent: #d4af37;
      --accent-dark: #b8941f;
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-light: #1e1e1e;
      --surface-lighter: #2a2a2a;
      --text: #f5f5f5;
      --text-secondary: #b0b0b0;
      --text-muted: #757575;
      --success: #4caf50;
      --danger: #e53935;
      --warning: #ff9800;
      --shadow: 0 4px 20px rgba(0,0,0,0.5);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    html, body {
      overflow-x: clip;
      max-width: 100%;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .container { 
      max-width: 1200px; 
      margin: 0 auto; 
      padding: 20px; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #content {
      width: 100%;
      text-align: left;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, rgba(26,35,126,0.4) 0%, rgba(0,0,0,0.8) 100%);
      border-bottom: 3px solid var(--accent);
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '⚖';
      position: absolute;
      font-size: 200px;
      opacity: 0.05;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.8rem;
      color: var(--accent);
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .tabs {
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 15px 0;
      margin-bottom: 25px;
      width: 100%;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--surface);
    }

    .tabs::-webkit-scrollbar { height: 6px; }
    .tabs::-webkit-scrollbar-track { background: var(--surface); border-radius: 3px; }
    .tabs::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

    .tab {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: var(--surface);
      border: 2px solid transparent;
      border-radius: var(--radius);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      font-weight: 500;
      min-width: fit-content;
      flex-shrink: 0;
    }

    .tab:hover { background: var(--surface-light); transform: translateY(-2px); }
    .tab.active {
      background: var(--primary);
      border-color: var(--accent);
      color: var(--text);
      box-shadow: 0 0 15px rgba(212,175,55,0.3);
    }

    .tab img { width: 32px; height: 32px; object-fit: cover; border-radius: 6px; }

    .sub-tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      overflow-x: auto;
      padding: 15px 0;
      margin-bottom: 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-light) var(--surface);
    }


    .sub-tabs::-webkit-scrollbar { height: 5px; }
    .sub-tabs::-webkit-scrollbar-track { background: var(--surface); border-radius: 3px; }
    .sub-tabs::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 3px; }

    .sub-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--surface-light);
      border: 2px solid transparent;
      border-radius: var(--radius);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      font-weight: 500;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .sub-tab:hover { background: var(--surface-lighter); }
    .sub-tab.active { background: var(--primary-light); border-color: var(--accent); color: var(--text); }
    .sub-tab img { width: 28px; height: 28px; object-fit: cover; border-radius: 5px; }

    .series-header {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 30px;
      margin-bottom: 30px;
      background: var(--surface);
      padding: 25px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .series-poster {
      width: 100%;
      border-radius: var(--radius);
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      object-fit: cover;
      aspect-ratio: 2/3;
    }

    .series-info h2 {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .series-title-original {
      font-size: 0.95rem;
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 10px;
      margin-top: -5px;
    }

    .series-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 15px;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .series-description {
      color: var(--text-secondary);
      margin-bottom: 20px;
      line-height: 1.7;
    }

    .progress-section {
      background: var(--surface-light);
      padding: 20px;
      border-radius: var(--radius);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-title { font-weight: 600; color: var(--text); }
    .progress-stats { color: var(--text-secondary); font-size: 0.9rem; }

    .progress-bar {
      height: 10px;
      background: var(--surface-lighter);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-dark));
      border-radius: 5px;
      transition: width 0.5s ease;
    }

    .progress-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
      font-size: 0.9rem;
    }

    .btn-primary { background: var(--primary); color: var(--text); }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-secondary { background: var(--surface-lighter); color: var(--text); }
    .btn-secondary:hover { background: #3a3a3a; }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #43a047; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #c62828; }

    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .season {
      margin-bottom: 25px;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .season-header {
      padding: 18px 25px;
      background: var(--surface-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .season-header:hover { background: var(--surface-lighter); }

    .season-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .season-progress { display: flex; align-items: center; gap: 15px; }

    .season-progress-bar {
      width: 120px;
      height: 6px;
      background: var(--surface-lighter);
      border-radius: 3px;
      overflow: hidden;
    }

    .season-progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .season-toggle {
      font-size: 1.2rem;
      color: var(--accent);
      transition: transform 0.3s ease;
    }

    .season.collapsed .season-toggle { transform: rotate(-90deg); }
    .episodes { padding: 20px 25px; }
    .season.collapsed .episodes { display: none; }

    .episode {
      display: grid;
      grid-template-columns: 60px 1fr auto;
      gap: 15px;
      align-items: center;
      padding: 15px;
      background: var(--surface-light);
      border-radius: 10px;
      margin-bottom: 12px;
      transition: var(--transition);
      border-left: 3px solid transparent;
    }

    .episode:hover { background: var(--surface-lighter); border-left-color: var(--accent); }
    .episode.watched { opacity: 0.7; }
    .episode.watched .episode-title { text-decoration: line-through; color: var(--text-muted); }

    .episode-number {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: var(--accent);
      border-radius: 10px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .episode-info { min-width: 0; }

    .episode-title {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .episode-meta { color: var(--text-secondary); font-size: 0.85rem; }

    .episode-actions { display: flex; gap: 8px; }

    .watch-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--surface-lighter);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      font-size: 1.1rem;
    }

    .watch-btn:hover { border-color: var(--accent); color: var(--accent); }
    .watch-btn.watched { background: var(--success); border-color: var(--success); color: white; }
    .watch-btn.watched:hover { background: var(--danger); border-color: var(--danger); }

    .crossover-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--accent, #d4af37);
      color: var(--accent, #d4af37);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      width: fit-content;
      max-width: 100%;
    }

    .crossover-icon {
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .crossover-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
   
    .global-stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      width: 100%;
    }

    .stat-card {
      background: var(--surface);
      padding: 20px;
      border-radius: var(--radius);
      text-align: center;
      border-top: 3px solid var(--accent);
      flex: 1 1 200px;
      max-width: 250px;
    }

    .stat-value { font-size: 2rem; font-weight: 700; color: var(--accent); margin-bottom: 5px; }
    .stat-label { color: var(--text-secondary); font-size: 0.9rem; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    .empty-state-icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.5; }

    footer {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      border-top: 1px solid var(--surface-lighter);
      margin-top: 50px;
    }

    @media (max-width: 768px) {
      header h1 { font-size: 2rem; }
      header p { font-size: 0.95rem; }

      .series-header { 
        grid-template-columns: 1fr; 
        text-align: center;
        justify-items: center;
      }
      
      .series-poster { 
        max-width: 180px; 
        margin: 0 auto; 
      }

      .series-info {
        width: 100%;
      }

      .series-info h2,
      .series-title-original,
      .series-meta,
      .series-description {
        text-align: center;
      }

      .series-meta {
        justify-content: center;
      }

     .season-header {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 12px;
        padding: 18px 20px;
      }

      .season-title {
        justify-content: center;
        font-size: 1.1rem;
      }

      .season-progress {
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 100%;
    }

      .progress-stats {
        font-size: 0.95rem;
        color: var (--text-secondary);
        white-space: nowrap;
      }

      .season-progress-bar {
        width: 100%;
        max-width: 260px;
        height: 6px;
      }

      .season-toggle {
        position:  absolute;
        right: 20px;
        top: 18px;
      }
 
      .episode { 
        grid-template-columns: 45px 1fr;
        gap: 10px;
      }

      .episode-actions { 
        grid-column: 1 / -1; 
        justify-content: flex-end;
      }

     .episode-title { 
	      white-space: normal; 
      }
  
      .watch-order-item {
	      grid-template-columns: 100px 1fr;
        gap: 12px 16px;
        padding: 18px 20px;
        align-items: start;
      }

      .watch-order-poster {
        width: 100px;
        height: 150px;
        grid-row: 1 / 4;
        border-radius: 6px;
        object-fit: cover;
        align-self: start;
      }

      .watch-order-info {
        grid-column: 2;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
        padding-top: 4px
      }
  
      .watch-order-actions {
	      grid-column: 1 / -1;
    	  justify-content: flex-end;
        margin-top: 6px;
      }
  
      .watch-order-main,
      .watch-order-title {
	      flex-direction: column;
	      align-items: flex-start;
	      gap: 2px;
      }

      .watch-order-series {
        font-size: 1rem;
        line-height: 1.35;
        white-space: normal;    
      }

      .watch-order-meta {
        font-size: 0.9rem;
        opacity: 0.85;
      }

      .watch-order-original {
        font-size: 0.85rem;
        opacity: 0.75;
      }

      .episode-pt {
        font-size: 0.9rem;
      }

      .episode-original {
        font-size: 0.85rem;
      }

      .separator {
	      display: none;
      }
  
      .global-stats {
	      gap: 10px;
      }
  
      .stat-card {
	      flex: 1 1 140px;
	      padding: 15px;
      }
  
      .stat-value {
	      font-size: 1.6rem;
      }
    
      .watch-order-section,
      .ordem-exibicao,
      .cronologica,
      #watchOrder,
      #ordem-cronologica,
      section[data-section="watch-order"] {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 100%;
      }

      .watch-order-section h2,
      .ordem-exibicao h2,
      .cronologica h2,
      #watchOrder h2,
      #ordem-cronologica h2,
      section[data-section="watch-order"] h2 {
        text-align: center;
        width: 100%;
      }

      .watch-order-section p,
      .ordem-exibicao p,
      .cronologica p,
      #watchOrder p,
      #ordem-cronologica p,
      section[data-section="watch-order"] p {
        text-align: center;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }

      .watch-order-section .progress-card,
      .watch-order-section .stats-card,
      .ordem-exibicao .progress-card,
      .cronologica .stats-card {
        margin-left: auto;
        margin-right: auto;
        text-align: center;
      }

      .watch-order-section .button-group,
      .ordem-exibicao .button-group,
      .cronologica .button-group {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .watch-order-list,
      .watch-order-container,
      .ordem-exibicao-lista {
        width: 100%;
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
      }
    
      /* ===== CENTRALIZAR TÍTULO — SÓ NO CELULAR ===== */
      .watch-order-header h2 {
        text-align: center !important;
        width: 100% !important;
        display: block !important;
        margin-left: auto !important;
        margin-right: auto !important;
      }

      /* ===== CENTRALIZAR O PARÁGRAFO DESCRITIVO ===== */
      .watch-order-section p,
      .ordem-exibicao p,
      .cronologica p,
      #watchOrder p,
      #ordem-cronologica p,
      section p,
      h2 + p {
        display: block !important;
        text-align: center !important;
        width: 100% !important;
        max-width: 600px !important;
        margin-left: auto !important;
        margin-right: auto !important;
        padding-left: 10px !important;
        padding-right: 10px !important;
      }
    
      /* ===== PROGRESSO GERAL, BARRA E BOTÕES — SÓ NO CELULAR ===== */
      .progress-section {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        text-align: center !important;
        width: 100% !important;
        gap: 10px !important; 
      }
      
      /* Título "Progresso Geral" e contador*/
      .progress-header {
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 2px !important;
        width: 100% !important;
        margin-bottom: 0 !important;
      }

      .progress-header h3 {
        text-align: center !important;
        margin: 0 !important;
      }

      .progress-header span,
      .progress-header .progress-stats {
        text-align: center !important;
        font-size: 0.95rem !important;
        color: var(--text-secondary) !important;
      }

      /* Barra de progresso */
      .progress-bar {
        display: block !important;
        width: 100% !important;
        max-width: 260px !important;
        height: 6px !important;
        margin: 0 auto !important;
        background: rgba(255, 255, 255, 0.1) !important;
        border-radius: 3px !important;
        overflow: hidden !important;  
      }

      /* Preencimento da barra */
      .progress-bar > div,
      .progress-bar .progress-fill {
        display: block !important;
        height: 100% !important;
        background: var(--accent) !important;
      }

      /* Botões */
      .progress-actions {
        flex-direction: column !important;
        align-items: center !important;
        gap: 10px !important;
        width: 100% !important;
        margin-top: 4px !important;
      }

      .progress-actions button {
        margin: 0 auto !important;
      }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeIn 0.3s ease; }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--surface);
      color: var(--text);
      padding: 15px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border-left: 4px solid var(--accent);
      transform: translateX(150%);
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    .toast.show { transform: translateX(0); }

    /* Watch Order Styles */
    .watch-order-header {
      background: var(--surface);
      padding: 20px;
      border-radius: var(--radius);
      margin-bottom: 25px;
    }

    .watch-order-header h2 {
      font-family: 'Cinzel', serif;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .watch-order-list { display: flex; flex-direction: column; gap: 12px; }

    .watch-order-item {
      background: var(--surface-light);
      padding: 15px 20px;
      border-radius: 10px;
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 15px;
      align-items: center;
      border-left: 3px solid transparent;
      transition: var(--transition);
      overflow: hidden;
    }

    .watch-order-item:hover { background: var(--surface-lighter); border-left-color: var(--accent); }
    .watch-order-item.watched { opacity: 0.7; }
    .watch-order-item.watched .watch-order-title { text-decoration: line-through; color: var(--text-muted); }

    .watch-order-poster {
      width: 80px;
      height: 120px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface-lighter);
      flex-shrink: 0;
    }

    .watch-order-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .watch-order-info { 
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .watch-order-main {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 10px;
    }

    .watch-order-series {
      color: var(--accent);
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 3px;
      display: flex;

function normalizeForMatch(title) {
  if (!title) return '';
  return title
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\w\s&]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function resolveEnglishTitle(title) {
  if (!title) return null;

  const normalized = normalizeForMatch(title);

  // Se já está em inglês
  for (const enTitle of Object.keys(SEASON_POSTERS)) {
    if (normalizeForMatch(enTitle) === normalized) {
      return enTitle;
    }
  }

  // Se está em português, converte
  if (SERIES_TITLE_PT_TO_EN[normalized]) {
    return SERIES_TITLE_PT_TO_EN[normalized];
  }

  // Tenta encontrar por aproximação
  const sortedPtTitles = Object.entries(SERIES_TITLE_PT_TO_EN)
    .sort(([a], [b]) => b.length - a.length);

  for (const [ptTitle, enTitle] of sortedPtTitles) {
    if (normalized.includes(ptTitle) || ptTitle.includes(normalized)) {
      return enTitle;
    }
  }

  return null;
}

function fetchSeasonPoster(seriesTitle, season) {
  const englishTitle = resolveEnglishTitle(seriesTitle) || seriesTitle;
  const normalizedTitle = normalizeForMatch(englishTitle);

  for (const [enTitle, posters] of Object.entries(SEASON_POSTERS)) {
    if (normalizeForMatch(enTitle) === normalizedTitle) {
      return Promise.resolve(posters[season] || null);
    }
  }

  return Promise.resolve(null);
}

function getPlaceholderSVG(seriesTitle, season) {
  const initials = seriesTitle
    .split(' ')
    .filter(word => word.length > 0 && word[0].match(/[a-zA-Z]/))
    .map(word => word[0].toUpperCase())
    .join('')
    .substring(0, 3);

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="150" viewBox="0 0 100 150"><rect width="100%" height="100%" fill="%231a237e"/><text x="50%" y="42%" fill="%23d4af37" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="middle">${initials}</text><text x="50%" y="58%" fill="%23ffffff" font-size="12" text-anchor="middle" dominant-baseline="middle">T${season}</text></svg>`;

  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

    const internationalOrder = ['conviction', 'russia-ci', 'russia-svu', 'paris', 'uk', 'toronto'];

    let currentTab = 'watch-order';
    let currentInternationalSeries = 'conviction';

    let watchedEpisodes = JSON.parse(localStorage.getItem('lawOrder_watched')) || {};
    let activeFilter = 'all';

    function generateEpisodeKey(seriesId, season, episode) {
      return `${seriesId}-s${season}-e${episode}`;
    }

    function isEpisodeWatched(key) {
      return watchedEpisodes[key] === true;
    }

    function toggleEpisodeWatched(key) {
      watchedEpisodes[key] = !watchedEpisodes[key];
      saveWatched();
      render();
    }

    function saveWatched() {
      localStorage.setItem('lawOrder_watched', JSON.stringify(watchedEpisodes));
    }

    function saveCollapsed() {
      localStorage.setItem('lawOrder_collapsedSeasons', JSON.stringify(collapsedSeasons));
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function countEpisodes(series) {
      let count = 0;
      for (const season in series.seasonsData) {
        count += series.seasonsData[season].length;
      }
      return count;
    }

    function countWatched(series) {
      let count = 0;
      for (const season in series.seasonsData) {
        series.seasonsData[season].forEach(ep => {
          if (isEpisodeWatched(generateEpisodeKey(series.id, season, ep.episode))) count++;
        });
      }
      return count;
    }

    function formatDate(dateString) {
      if (!dateString) return 'Data desconhecida';
      const [year, month, day] = dateString.split('T')[0].split('-');
      if (!year || !month || !day) return 'Data inválida';
      return `${day.padStart(2, '0')}.${month.padStart(2, '0')}.${year}`;
    }

    function renderTabs() {
      const tabsContainer = document.getElementById('tabs');
      tabsContainer.innerHTML = tabsConfig.map(tab => `

          ${tab.label}
        </button>
      `).join('');
    }

    function setTab(tabId) {
      currentTab = tabId;
      currentSearch = '';
      activeFilter = 'all';
      render();
    }

    function renderGlobalStats() {
      let totalSeries = Object.keys(seriesData).length + Object.keys(internationalData).length;
      let totalEpisodes = 0;
      let totalWatched = 0;

      [...Object.values(seriesData), ...Object.values(internationalData)].forEach(series => {
        const eps = countEpisodes(series);
        totalEpisodes += eps;
        totalWatched += countWatched(series);
      });

      const progress = totalEpisodes > 0 ? Math.round((totalWatched / totalEpisodes) * 100) : 0;

      document.getElementById('total-series').textContent = totalSeries;
      document.getElementById('total-episodes').textContent = totalEpisodes;
      document.getElementById('watched-episodes').textContent = totalWatched;
      document.getElementById('overall-progress').textContent = progress + '%';
    }

    function renderSeries(seriesId) {
      const series = seriesData[seriesId] || internationalData[seriesId];
      if (!series) return '';

      const totalEpisodes = countEpisodes(series);
      const watchedCount = countWatched(series);
      const progress = totalEpisodes > 0 ? Math.round((watchedCount / totalEpisodes) * 100) : 0;

      const fallbackImage = 'https://via.placeholder.com/300x450?text=Sem+Poster';
      
      let html = `
        <div class="series-header fade-in">
          <img src="${series.image || fallbackImage}"

                <button class="btn btn-secondary" onclick="markSeries('${seriesId}', false)">Desmarcar todos</button>
              </div>
            </div>
          </div>
        </div>

      `;

      const seasonNumbers = Object.keys(series.seasonsData).map(Number).sort((a, b) => a - b);

      seasonNumbers.forEach(season => {
        const episodes = series.seasonsData[season];
        const seasonKey = `${seriesId}-season-${season}`;
        const isCollapsed = collapsedSeasons[seasonKey];
        
        // Verifica se a temporada está vazia (em andamento)
        if (episodes.length === 0) {
          html += `
            <div class="season fade-in">
              <div class="season-header" onclick="toggleSeason('${seasonKey}')">
                <div class="season-title">
                  <span>📁</span>
                  <span>Temporada ${season}</span>
                </div>
                <div class="season-progress">
                  <span class="progress-stats">em andamento</span>
                  <span class="season-toggle">▼</span>
                </div>
              </div>
              <div class="episodes">
                <div class="ongoing-season">
                  <p>📺 Temporada em andamento</p>
                  <span>Episódios serão adicionados conforme forem exibidos.</span>
                </div>
              </div>
            </div>
          `;
          return;
        }

        const filteredEpisodes = filterEpisodes(seriesId, season, episodes);
        if (filteredEpisodes.length === 0 && currentSearch) return;
                 
        const seasonWatched = episodes.filter(ep => isEpisodeWatched(generateEpisodeKey(seriesId, season, ep.episode))).length;
        const seasonProgress = episodes.length > 0 ? Math.round((seasonWatched / episodes.length) * 100) : 0;
  
        html += `
          <div class="season ${isCollapsed ? 'collapsed' : ''} fade-in">
            <div class="season-header" onclick="toggleSeason('${seasonKey}')">
              <div class="season-title">📁 Temporada ${season}</div>
              <div class="season-progress">
                <span class="progress-stats">${seasonWatched}/${episodes.length} episódios (${seasonProgress}%)</span>
                <div class="season-progress-bar">
                  <div class="season-progress-fill" style="width: ${seasonProgress}%"></div>
                </div>
                <span class="season-toggle">▼</span>
              </div>
            </div>
            <div class="episodes">
              ${filteredEpisodes.map(ep => renderEpisode(seriesId, season, ep)).join('')}
            </div>
          </div>
        `;
      });

      document.getElementById('content').innerHTML = html;

      // Carrega os posters reais das temporadas depois que o HTML já estiver na tela
      setTimeout(() => {
        const seriesTitle = series.title;
        Object.keys(series.seasonsData).map(Number).sort((a, b) => a - b).forEach(season => {
          const episodes = series.seasonsData[season] || [];
          episodes.forEach(async ep => {
            const key = generateEpisodeKey(seriesId, season, ep.episode);
            const posterId = `poster-${key.replace(/[^a-zA-Z0-9]/g, '-')}`;
            const url = await fetchSeasonPoster(seriesTitle, season);
            if (url) {
            const img = document.getElementById(posterId);
            if (img) img.src = url;
          }
        });
      });
    }, 100);

    return html;
  }

    function renderCrossoverBadge(crossover) {
      if (!crossover) return '';
      return `
        <div class="crossover-badge" title="${crossover.label || ''}">
          <span class="crossover-icon">🔄</span>
          <span class="crossover-text">${crossover.label || 'Crossover'}</span>
        </div>
      `;
    }
    
    function renderEpisode(seriesId, season, ep) {
      const key = generateEpisodeKey(seriesId, season, ep.episode);
      const watched = isEpisodeWatched(key);

      const series = seriesData[seriesId] || internationalData[seriesId];
      const seriesTitle = series ? series.title : '';
      const placeholder = getPlaceholderSVG(seriesTitle, season);
      const posterId = `poster-${key.replace(/[^a-zA-Z0-9]/g, '-')}`;

      return `
        <div class="episode ${watched ? 'watched' : ''}" data-key="${key}">
          <div class="episode-poster">
            <img id="${posterId}" src="${placeholder}" alt="${ep.title}" loading="lazy">
          </div>
          <div class="episode-info">
            <div class="episode-title">${ep.title}${ep.crossover ? ' [TEM CROSSOVER]' : ''}</div>
	          <div class="episode-meta">Temporada ${season}, Episódio ${ep.episode} • ${formatDate(ep.airDate)}</div>
	          ${renderCrossoverBadge(ep.crossover)}
	        </div> 
          <div class="episode-actions">
            <button class="watch-btn ${watched ? 'watched' : ''}" onclick="toggleEpisodeWatched('${key}')" title="${watched ? 'Desmarcar' : 'Marcar como assistido'}">
              ${watched ? '✓' : '○'}
            </button>
          </div>
        </div>
      `;
    }

     function filterEpisodes(seriesId, season, episodes) {
      return episodes.filter(ep => {
        const key = generateEpisodeKey(seriesId, season, ep.episode);
        const watched = isEpisodeWatched(key);
        const matchesSearch = ep.title.toLowerCase().includes(currentSearch.toLowerCase()) || 
                              ep.episode.toString().includes(currentSearch);
        
        if (!matchesSearch) return false;
        if (activeFilter === 'watched') return watched;
        if (activeFilter === 'unwatched') return !watched;
        return true;
      });
    }

    function renderInternational() {
      let html = `
        <div class="sub-tabs fade-in">
          ${internationalOrder.map(id => {
            const series = internationalData[id];
            const total = countEpisodes(series);
            const watched = countWatched(series);
            return `
              <button class="sub-tab ${currentInternationalSeries === id ? 'active' : ''}" onclick="setInternationalSeries('${id}')">
  		${series.shortTitle}
	      </button>
            `;
          }).join('')}
        </div>
      `;

      html += `<div id="international-content">${renderSeries(currentInternationalSeries)}</div>`;
      return html;
    }

    function setInternationalSeries(seriesId) {
      currentInternationalSeries = seriesId;
      currentSearch = '';
      activeFilter = 'all';
      render();
    }

    function getAllEpisodes() {
      const all = [];
      [seriesData, internationalData].forEach(dataset => {
        Object.values(dataset).forEach(series => {
          Object.entries(series.seasonsData).forEach(([season, episodes]) => {
            episodes.forEach(ep => {
              all.push({
                ...ep,
                seriesId: series.id,
                seriesTitle: series.title,
                shortTitle: series.shortTitle,
                season: Number(season),
                key: generateEpisodeKey(series.id, season, ep.episode)
              });
            });
          });
        });
      });
      return all.sort((a, b) => {
	const dateA = new Date(a.airDate).getTime();
	const dateB = new Date(b.airDate).getTime();
    
	// 1. Ordena por data
	if (dateA !== dateB) {
          return dateA - dateB;
        }

	// 2. Se a data for igual e ambos tiverem crossover.type, ordena por fase do crossover
	const typeA = a.crossover?.type;
    	const typeB = b.crossover?.type;

	if (typeA && typeB) {
      	  const rank = { start: 1, middle: 2, end: 3 };
          return (rank[typeA] || 0) - (rank[typeB] || 0);
	}

      return 0;
    });
  }

     function getCrossoverPart(ep) {
       const text = `${ep.title} ${ep.crossover?.label || ''}`.toLowerCase();

 	if (text.includes('(i)') || text.includes('part 1') || text.includes('part one')) {
    return 1;
  	}

	if (text.includes('(ii)') || text.includes('part 2') || text.includes('part two')) {
    return 2;
  	}

	if (text.includes('(iii)') || text.includes('part 3') || text.includes('part three')) {
    return 3;
  	}

	return 0;
  }

     function parseEpisodeTitle(fullTitle) {
       const match = fullTitle.match(/^(.+?)\s*\((.+?)\)$/);
       if (match) {
    	 return { pt: match[1].trim(), original: match[2].trim() };
       }
       return { pt: fullTitle, original: fullTitle };
     }

     async function renderWatchOrder() {
       const episodes = getAllEpisodes();
       const total = episodes.length;
       const watched = episodes.filter(ep => isEpisodeWatched(ep.key)).length;
       const progress = total > 0 ? Math.round((watched / total) * 100) : 0;

  let html = `

      <h2>Ordem de Exibição Cronológica</h2>

      <div class="progress-section" style="margin-top: 15px;">
        <div class="progress-header">
          <span class="progress-title">Progresso Geral</span>
          <span class="progress-stats">${watched}/${total} episódios (${progress}%)</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: ${progress}%"></div>
        </div>
        <div class="progress-actions">
          <button class="btn btn-primary" onclick="markAll(true)">Marcar tudo como assistido</button>
          <button class="btn btn-secondary" onclick="markAll(false)">Desmarcar tudo</button>
        </div>
      </div>
    </div>

    <div class="watch-order-list">
  `;

  const internationalIds = ['conviction', 'russia-ci', 'russia-svu', 'paris', 'uk', 'toronto'];
  const filtered = episodes.filter(ep => {
    if (internationalIds.includes(ep.seriesId)) return false;

    const watched = isEpisodeWatched(ep.key);
    const matchesSearch = ep.title.toLowerCase().includes(currentSearch.toLowerCase()) ||
                  ep.seriesTitle.toLowerCase().includes(currentSearch.toLowerCase()) ||
                  ep.episode.toString().includes(currentSearch);
    if (!matchesSearch) return false;
    if (activeFilter === 'watched') return watched;
    if (activeFilter === 'unwatched') return !watched;
    return true;
  });

  for (const ep of filtered) {
    const isWatched = isEpisodeWatched(ep.key);
    const formattedDate = ep.airDate
      ? `${ep.airDate.split('-')[2]}/${ep.airDate.split('-')[1]}/${ep.airDate.split('-')[0]}`
      : 'Data desconhecida';

    const placeholder = getPlaceholderSVG(ep.seriesTitle, ep.season);
    const posterId = `poster-${ep.key.replace(/[^a-zA-Z0-9]/g, '-')}`;

    const series = seriesData[ep.seriesId];
    const seriesTitle = series ? series.title : ep.seriesTitle;
    const seriesTitleOriginal = series && series.titleOriginal ? series.titleOriginal : seriesTitle;
    const episodeTitles = parseEpisodeTitle(ep.title);

    html += `
      <div class="watch-order-item ${isWatched ? 'watched' : ''} fade-in">
        <div class="watch-order-poster">
          <img id="${posterId}" src="${placeholder}" alt="${ep.seriesTitle}">
        </div>
        <div class="watch-order-info">
          <div class="watch-order-series">
            <strong>${seriesTitle}</strong> (${seriesTitleOriginal})<span class="separator"></span>T${ep.season}E${ep.episode}<span class="separator"></span>${formattedDate}
	  </div>
          <div class="watch-order-title">
	    <span class="episode-pt">${episodeTitles.pt}</span> <span class="episode-original">(${episodeTitles.original})</span> 
	  </div>
       	  ${ep.crossover ? renderCrossoverBadge(ep.crossover) : ''}
        </div>
        <div class="watch-order-actions">
          <button class="watch-btn ${isWatched ? 'watched' : ''}" onclick="toggleEpisodeWatched('${ep.key}')" title="${isWatched ? 'Desmarcar' : 'Marcar como assistido'}">
            ${isWatched ? '✓' : '○'}
          </button>
        </div>
      </div>
    `;
  }

  html += `</div>`;

  document.getElementById('content').innerHTML = html;

    // Carrega pôsteres em segundo plano respeitando a fila
    const posterJobs = filtered.map(ep => {
      const posterId = `poster-${ep.key.replace(/[^a-zA-Z0-9]/g, '-')}`;
      const series = seriesData[ep.seriesId];
      const titleForPoster = series && series.titleOriginal ? series.titleOriginal : ep.seriesTitle;
      return fetchSeasonPoster(titleForPoster, ep.season)
        .then(url => {
          if (url) {
            const img = document.getElementById(posterId);
            if (img) img.src = url;
          }
        });
    });

    await Promise.all(posterJobs);
  }


    function markAll(watched) {
      const episodes = getAllEpisodes();
      episodes.forEach(ep => {
        watchedEpisodes[ep.key] = watched;
      });
      saveWatched();
      showToast(watched ? 'Todos os episódios marcados como assistidos' : 'Todos os episódios desmarcados');
      render();
    }

    function render() {
      renderTabs();
      renderGlobalStats();

      const content = document.getElementById('content');
      if (currentTab === 'watch-order') {
        renderWatchOrder();
	return;
      } else if (currentTab === 'international') {
        content.innerHTML = renderInternational();
      } else {
        content.innerHTML = renderSeries(currentTab);
      }
    }

    function toggleSeason(seasonKey) {
      collapsedSeasons[seasonKey] = !collapsedSeasons[seasonKey];
      saveCollapsed();
      render();
    }

    function setSearch(value) {
      currentSearch = value;
      render();
    }

    function setFilter(value) {
      activeFilter = value;
      render();
    }

    function markSeries(seriesId, watched) {
      const series = seriesData[seriesId] || internationalData[seriesId];
      for (const season in series.seasonsData) {
        series.seasonsData[season].forEach(ep => {
          const key = generateEpisodeKey(seriesId, season, ep.episode);
          watchedEpisodes[key] = watched;
        });
      }
      saveWatched();
      showToast(watched ? 'Todos os episódios marcados como assistidos' : 'Todos os episódios desmarcados');
      render();
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }
  </script>
